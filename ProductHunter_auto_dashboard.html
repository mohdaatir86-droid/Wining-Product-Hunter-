<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Hunter AI</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#172033}
.wrap{max-width:1100px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
h1{margin:0;font-size:28px}.sub{color:#667085}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #0000000b}
.row{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#e9eef7;color:#172033}
.status{padding:8px 12px;border-radius:999px;background:#eee;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.product{border:1px solid #e5e7eb;border-radius:14px;padding:15px}
.score{font-size:24px;font-weight:800}.meta{color:#667085;font-size:13px;line-height:1.5}
.price{font-size:18px;font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px;margin:3px}
.empty{color:#667085;text-align:center;padding:30px}
.small{font-size:12px;color:#667085}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Product Hunter AI</h1><div class="sub">Kitchen Utility + Home Décor • automatic discovery</div></div>
  <div id="apiStatus" class="status">Checking backend…</div>
</header>

<div class="card">
  <div class="row">
    <button class="btn primary" onclick="startHunt('all')">🚀 Run Both Categories</button>
    <button class="btn secondary" onclick="startHunt('kitchen_utility')">Kitchen Utility</button>
    <button class="btn secondary" onclick="startHunt('home_decor')">Home Décor</button>
    <button class="btn secondary" onclick="loadProducts()">↻ Refresh Products</button>
  </div>
  <p id="huntStatus" class="small">Backend hunts scrape, match, score and accept products automatically. Results can take several minutes.</p>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">Accepted Products <span id="count"></span></h2>
    <span class="small">Score ≥ 60 • automatic filters</span>
  </div>
  <div id="products" class="grid"><div class="empty">Loading…</div></div>
</div>
</div>

<script>
const API="https://wining-product-hunter.onrender.com";

async function api(path, options={}) {
  const r=await fetch(API+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
  const text=await r.text();
  let data; try{data=JSON.parse(text)}catch{data={raw:text}};
  if(!r.ok) throw new Error(data.detail||data.raw||("HTTP "+r.status));
  return data;
}

async function health(){
  const el=document.getElementById("apiStatus");
  try{
    const d=await api("/health");
    el.textContent=`Backend v${d.version||"?"} • ${d.status||"ok"}`;
    el.style.background="#dcfce7";
  }catch(e){
    el.textContent="Backend unavailable";
    el.style.background="#fee2e2";
  }
}

async function startHunt(category){
  const label=category==="all"?"both categories":category.replaceAll("_"," ");
  const s=document.getElementById("huntStatus");
  s.textContent=`Starting ${label} hunt… Apify collection may take 5–10 minutes.`;
  try{
    const path=category==="all"?"/auto-hunt/all":`/auto-hunt/${category}`;
    const d=await api(path,{method:"POST"});
    s.textContent=`${d.message||"Hunt started."} Run ID: ${d.run_id??"—"}. Products will appear automatically when processing finishes.`;
  }catch(e){s.textContent="Hunt error: "+e.message}
}

function productCard(p){
  const score=Number(p.score??p.winner_score??0).toFixed(1);
  const name=p.name||p.product_name||"Unnamed product";
  const price=p.selling_price??p.price;
  const cogs=p.cost_of_goods??p.cogs;
  const markup=p.markup;
  const verdict=p.verdict||"ACCEPTED";
  const category=(p.category||"").replaceAll("_"," ");
  return `<div class="product">
    <div class="row" style="justify-content:space-between"><b>${esc(name)}</b><span class="score">${score}</span></div>
    <div class="pill">${esc(verdict)}</div>
    ${category?`<div class="pill">${esc(category)}</div>`:""}
    <p class="price">${price!=null?"Selling: $"+esc(price):""}</p>
    <div class="meta">
      ${cogs!=null?"COGS: $"+esc(cogs)+"<br>":""}
      ${markup!=null?"Markup: "+esc(markup)+"x<br>":""}
      ${p.rating!=null?"Rating: "+esc(p.rating)+" • ":""}${p.reviews!=null?"Reviews: "+esc(p.reviews):""}
    </div>
    ${p.product_url||p.url?`<p><a href="${esc(p.product_url||p.url)}" target="_blank" rel="noopener">View product ↗</a></p>`:""}
  </div>`;
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function loadProducts(){
  const box=document.getElementById("products");
  try{
    const d=await api("/products/accepted?limit=50");
    const list=d.products||[];
    document.getElementById("count").textContent=`(${list.length})`;
    box.innerHTML=list.length?list.map(productCard).join(""):'<div class="empty">No accepted products yet. Start a hunt or wait for the scheduled automatic hunt.</div>';
  }catch(e){box.innerHTML=`<div class="empty">Could not load products: ${esc(e.message)}</div>`}
}

health(); loadProducts();
setInterval(health,30000);
setInterval(loadProducts,15000);
</script>
</body>
</html>
