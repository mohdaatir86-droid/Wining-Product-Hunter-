name: Test API Connection

on:
  workflow_dispatch:  # Allows manual triggering
  push:
    branches: [main]
    paths:
      - 'app/**.py'
      - '.env'

jobs:
  test-api:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests python-dotenv
    
    - name: Test API Connection
      env:
        RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        RAPIDAPI_HOST: amazon-data-scraper-api2.p.rapidapi.com
      run: |
        echo "=== Testing API Connection ==="
        python -c "
import os
import requests

api_key = os.getenv('RAPIDAPI_KEY')
api_host = os.getenv('RAPIDAPI_HOST', 'amazon-data-scraper-api2.p.rapidapi.com')

print(f'API Key present: {bool(api_key)}')

if not api_key:
    print('ERROR: RAPIDAPI_KEY not set in GitHub Secrets!')
    print('Please add it at: Settings > Secrets and variables > Actions')
    exit(1)

headers = {
    'X-RapidAPI-Key': api_key,
    'X-RapidAPI-Host': api_host
}

try:
    url = f'https://{api_host}/search'
    params = {'searchQuery': 'headphones', 'maxResults': 1}
    
    print(f'Making request to: {url}')
    response = requests.get(url, headers=headers, params=params, timeout=30)
    
    print(f'Status Code: {response.status_code}')
    
    if response.status_code == 200:
        print('SUCCESS! API is working!')
        data = response.json()
        print(f'Response type: {type(data)}')
        print(f'Keys: {list(data.keys()) if isinstance(data, dict) else "List with " + str(len(data)) + " items"}')
    else:
        print(f'API returned error: {response.status_code}')
        print(f'Response: {response.text[:200]}')
        
except Exception as e:
    print(f'ERROR: {type(e).__name__}: {e}')
    exit(1)
"
