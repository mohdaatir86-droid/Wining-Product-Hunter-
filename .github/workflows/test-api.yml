name: Product Hunter CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'render.yaml'
      - 'Procfile'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app
      - name: Import application and verify routes
        run: |
          python - <<'PY'
          from app.main import app, VERSION
          routes = {getattr(route, 'path', '') for route in app.routes}
          required = {'/health', '/products/accepted', '/source-health', '/pipeline/latest', '/scraper-data/latest', '/demand-signals/status', '/'}
          missing = required - routes
          assert not missing, f'Missing required routes: {sorted(missing)}'
          assert VERSION, 'Application version is empty'
          print(f'Product Hunter {VERSION}: {len(routes)} routes registered')
          PY
